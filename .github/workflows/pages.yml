name: Deploy demo to GitHub Pages

# 仅部署 pages-demo 分支的演示版；main 分支不触发
on:
  push:
    branches: [pages-demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Typecheck and frontend tests
        run: |
          npm run typecheck
          npm test
      - name: Build demo
        # 自定义域名 fdc.dntof.com 时 base_path 为 "/"，不能再拼成 "//"。
        run: |
          raw="${{ steps.pages.outputs.base_path }}"
          if [ -z "$raw" ] || [ "$raw" = "/" ]; then
            export FDC_BASE=/
          else
            export FDC_BASE="${raw%/}/"
          fi
          echo "FDC_BASE=$FDC_BASE"
          npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
